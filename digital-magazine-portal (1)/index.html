
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOOT Digital Magazine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700;900&family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <!-- Quill 2.0.2 Modern Styles -->
    <link href="https://unpkg.com/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        
        /* 3D Book Perspective */
        .magazine-container {
            perspective: 4000px;
            perspective-origin: 50% 50%;
        }

        .page-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-origin: left center;
        }

        .page-wrapper.flipped {
            transform: rotateY(-180deg) translateX(-1px);
        }

        .page-front, .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0 8px 8px 0;
            box-shadow: 15px 0 60px -15px rgba(0,0,0,0.7);
        }

        .page-back {
            transform: rotateY(180deg);
            background: #111;
            border-radius: 8px 0 0 8px;
        }

        /* Paper Grain Texture */
        .paper-texture {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Editorial Typo */
        .drop-cap::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 6.5rem;
            line-height: 0.7;
            padding-top: 1rem;
            padding-right: 1rem;
            padding-left: 0.5rem;
            font-weight: 900;
            font-style: italic;
            color: #4f46e5;
        }

        /* Spotlight Animasyonları */
        @keyframes moveSpotlight {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(15%, 10%) scale(1.1); }
            100% { transform: translate(-5%, 20%) scale(1); }
        }

        @keyframes moveSpotlightReverse {
            0% { transform: translate(10%, 10%) scale(1.1); }
            50% { transform: translate(-15%, -5%) scale(1); }
            100% { transform: translate(5%, -15%) scale(1.1); }
        }

        /* Parlak SPOOT Yazısı Animasyonu */
        @keyframes bg-text-glow {
            0%, 100% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(20px); }
            50% { opacity: 0.12; transform: scale(1.05) translateY(0px); filter: blur(2px); }
        }

        /* Arka Plan Medya Yansıması Animasyonu */
        @keyframes bg-media-glow {
            0%, 100% { opacity: 0; transform: scale(0.8) rotate(-5deg); filter: blur(40px) grayscale(100%); }
            50% { opacity: 0.08; transform: scale(1) rotate(0deg); filter: blur(10px) grayscale(50%); }
        }

        /* Reklam İkonu Parlama Efekti */
        @keyframes icon-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.8); }
            50% { transform: scale(1.2); box-shadow: 0 0 35px rgba(255,255,255,0.8); border-color: rgba(255,255,255,1); }
        }

        .animate-icon-pulse {
            animation: icon-pulse 1.5s infinite ease-in-out;
        }

        .floating-bg-text {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            font-style: italic;
            color: white;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            animation: bg-text-glow 12s infinite ease-in-out;
        }

        .floating-media-shard {
            position: absolute;
            pointer-events: none;
            user-select: none;
            animation: bg-media-glow 18s infinite ease-in-out;
            overflow: hidden;
            border-radius: 20px;
        }

        .spotlight {
            position: fixed;
            width: 70vw;
            height: 70vw;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(120px);
            opacity: 0.2;
        }

        .spotlight-indigo {
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            top: -20%;
            left: -20%;
            animation: moveSpotlight 25s infinite alternate ease-in-out;
        }

        .spotlight-amber {
            background: radial-gradient(circle, #f59e0b 0%, transparent 70%);
            bottom: -30%;
            right: -20%;
            animation: moveSpotlightReverse 30s infinite alternate ease-in-out;
        }

        /* Quill Editor Custom Theme Overrides */
        .ql-toolbar.ql-snow {
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
            background: #1e293b;
            border-color: #334155 !important;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .ql-container.ql-snow {
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border-color: #334155 !important;
            font-family: 'Inter', sans-serif;
            font-size: 1.125rem;
            color: #e2e8f0;
            min-height: 300px;
        }
        .ql-editor {
            min-height: 300px;
            line-height: 1.8;
        }
        .ql-snow .ql-stroke { stroke: #94a3b8 !important; }
        .ql-snow .ql-fill { fill: #94a3b8 !important; }
        .ql-snow .ql-picker { color: #94a3b8 !important; }
        .ql-snow.ql-toolbar button:hover .ql-stroke { stroke: #818cf8 !important; }
        .ql-editor.ql-blank::before { color: #475569 !important; font-style: italic; }

        @keyframes pulse-neon {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
            50% { opacity: 0.8; transform: scale(0.98); box-shadow: 0 0 30px rgba(255,255,255,0.3); }
        }
        .animate-pulse-neon {
            animation: pulse-neon 3s infinite ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.3",

    "react-dom": "https://esm.sh/react-dom@19.2.3",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
